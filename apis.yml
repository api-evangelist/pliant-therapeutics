name: Pliant Therapeutics
description: >-
  Pliant Therapeutics is a clinical-stage biopharmaceutical company focused on the
  discovery and development of integrin-based therapies for underserved areas of
  medical need. Leveraging a proprietary integrin drug discovery and delivery
  platform, its lead program PLN-101095 is a dual-selective avb8/avb1 integrin
  inhibitor being evaluated in the FORTIFY clinical trial for patients with advanced
  or metastatic solid tumors, alongside additional pipeline programs in fibrosis and
  oncology. The company was surfaced as a portfolio company of Menlo Ventures and
  added to the API Evangelist network. As a clinical-stage pharmaceutical company,
  Pliant Therapeutics publishes no public developer API, SDK, or API documentation
  surface; this profile captures corporate identity and web presence only.
